name: Build Emulator

on:
  push:
    branches: [master, ci/**]
    paths:
      - 'projects/CardputerZero-Emulator/**'
      - 'projects/APPLaunch/**'
      - 'projects/UserDemo/**'
      - 'SDK/**'
      - '.github/workflows/emulator-build.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── macOS ───────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Initialize SDK submodule
      run: git submodule update --init --depth=1 SDK
    - name: Install SDK Python dependencies
      run: python3 -m pip install --user --break-system-packages parse requests tqdm
    - name: Prepare SDK eventpp source
      run: |
        cd projects/APPLaunch
        bash ../../.github/scripts/prepare-sdk-source.sh eventpp include/eventpp/callbacklist.h
    - name: Clone LVGL
      run: |
        git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git projects/CardputerZero-Emulator/lib/lvgl
    - name: Install dependencies
      run: brew install sdl2 sdl2_image freetype pkg-config nlohmann-json
    - name: Build
      run: |
        cd projects/CardputerZero-Emulator
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(sysctl -n hw.ncpu)
    - name: Test
      run: ctest --test-dir projects/CardputerZero-Emulator/build --output-on-failure
    - name: Package
      run: |
        cd projects/CardputerZero-Emulator
        mkdir -p dist/CardputerZero-Emulator
        cp build/cardputer-zero-emu dist/CardputerZero-Emulator/
        cp -r build/apps dist/CardputerZero-Emulator/
        cp -r build/assets dist/CardputerZero-Emulator/
        cp -r build/images dist/CardputerZero-Emulator/
        cp -r build/APPLaunch dist/CardputerZero-Emulator/
        cd dist/CardputerZero-Emulator
        SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy EMU_TEST_NAVIGATE_FRAME=10 EMU_TEST_QUIT_FRAME=20 ./cardputer-zero-emu
        cd ..
        tar czf ../CardputerZero-Emulator-macOS.tar.gz CardputerZero-Emulator
    - uses: actions/upload-artifact@v4
      with:
        name: emulator-macos
        path: projects/CardputerZero-Emulator/CardputerZero-Emulator-macOS.tar.gz

  # ── Linux ───────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Initialize SDK submodule
      run: git submodule update --init --depth=1 SDK
    - name: Install SDK Python dependencies
      run: python3 -m pip install --user --break-system-packages parse requests tqdm
    - name: Prepare SDK eventpp source
      run: |
        cd projects/APPLaunch
        bash ../../.github/scripts/prepare-sdk-source.sh eventpp include/eventpp/callbacklist.h
    - name: Clone LVGL
      run: |
        git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git projects/CardputerZero-Emulator/lib/lvgl
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libfreetype-dev libinput-dev libxkbcommon-dev libudev-dev pkg-config nlohmann-json3-dev
    - name: Build
      run: |
        cd projects/CardputerZero-Emulator
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)
    - name: Package
      run: |
        cd projects/CardputerZero-Emulator
        mkdir -p dist/CardputerZero-Emulator
        cp build/cardputer-zero-emu dist/CardputerZero-Emulator/
        cp -r build/apps dist/CardputerZero-Emulator/
        cp -r build/assets dist/CardputerZero-Emulator/
        cp -r build/images dist/CardputerZero-Emulator/
        cd dist && tar czf ../CardputerZero-Emulator-Linux.tar.gz CardputerZero-Emulator
    - uses: actions/upload-artifact@v4
      with:
        name: emulator-linux
        path: projects/CardputerZero-Emulator/CardputerZero-Emulator-Linux.tar.gz

  # ── Windows (MinGW-w64) ─────────────────────────────────────
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-SDL2_image
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-winpthreads-git
          mingw-w64-x86_64-python-pip
          make
          git
    - uses: actions/checkout@v4
    - name: Initialize SDK submodule
      run: git submodule update --init --depth=1 SDK
    - name: Install SDK Python dependencies
      run: python -m pip install --break-system-packages parse requests tqdm
    - name: Prepare SDK eventpp source
      run: |
        cd projects/APPLaunch
        PYTHON=python bash ../../.github/scripts/prepare-sdk-source.sh eventpp include/eventpp/callbacklist.h
    - name: Clone LVGL
      run: |
        git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git projects/CardputerZero-Emulator/lib/lvgl
    - name: Build
      run: |
        cd projects/CardputerZero-Emulator
        mkdir build && cd build
        cmake .. -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)
    - name: Package
      run: |
        cd projects/CardputerZero-Emulator
        mkdir -p dist/CardputerZero-Emulator
        cp build/cardputer-zero-emu.exe dist/CardputerZero-Emulator/
        cp -r build/apps dist/CardputerZero-Emulator/ 2>/dev/null || true
        cp -r build/assets dist/CardputerZero-Emulator/ 2>/dev/null || true
        cp -r build/images dist/CardputerZero-Emulator/ 2>/dev/null || true
        ldd build/cardputer-zero-emu.exe | grep mingw64 | awk '{print $3}' | while read dll; do
          cp "$dll" dist/CardputerZero-Emulator/
        done
        cd dist && tar czf ../CardputerZero-Emulator-Windows.tar.gz CardputerZero-Emulator
    - uses: actions/upload-artifact@v4
      with:
        name: emulator-windows
        path: projects/CardputerZero-Emulator/CardputerZero-Emulator-Windows.tar.gz

  # ── Web (Emscripten/WASM) ───────────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Initialize SDK submodule
      run: git submodule update --init --depth=1 SDK
    - name: Install SDK Python dependencies
      run: python3 -m pip install --user --break-system-packages parse requests tqdm
    - name: Prepare SDK eventpp source
      run: |
        cd projects/APPLaunch
        bash ../../.github/scripts/prepare-sdk-source.sh eventpp include/eventpp/callbacklist.h
    - name: Clone LVGL
      run: |
        git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git projects/CardputerZero-Emulator/lib/lvgl
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.74
    - name: Build
      run: |
        cd projects/CardputerZero-Emulator
        mkdir build-web && cd build-web
        emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
        emmake make -j$(nproc)
    - name: Package
      run: |
        cd projects/CardputerZero-Emulator
        mkdir -p dist-web
        cp build-web/index.html dist-web/
        cp build-web/index.js dist-web/
        cp build-web/index.wasm dist-web/
        cp build-web/index.data dist-web/
        cd dist-web && zip -r ../CardputerZero-Emulator-Web.zip .
    - uses: actions/upload-artifact@v4
      with:
        name: emulator-web
        path: projects/CardputerZero-Emulator/CardputerZero-Emulator-Web.zip
