<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- 测试用私有 dbus-daemon 配置: 生成时会把 /home/nihao/w2T/github/launcher/ext_components/bluectl/tests/testbus.sock 替换为实际套接字路径 -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:path=/home/nihao/w2T/github/launcher/ext_components/bluectl/tests/testbus.sock</listen>
  <apparmor mode="disabled"/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
